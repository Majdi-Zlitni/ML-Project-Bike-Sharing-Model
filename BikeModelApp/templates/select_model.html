<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>
      Choisir DSO pour faire le prediction
    </title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">
        Choisir un Modèle
      </h1>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <form
            action="{{ url_for('select_model') }}"
            method="post"
          >
            <div class="mb-3">
              <label
                for="model"
                class="form-label"
                >Choose a model:</label
              >
              <select
                name="model"
                id="model"
                class="form-select"
              >
                <option value="modele_KNN_DSO2">
                  Predction du nombre de vélos
                  loués avec KNN
                </option>
                <option value="modele_SVM_DSO1">
                  Predction du facteurs influents
                  sur la Visibilité avec SVM
                </option>
                <option
                  value="modele_Régression_Linéaire_DSO3"
                >
                  Predction les périodes et
                  conditions de faible demande
                </option>
              </select>
            </div>
            <div class="d-grid gap-2">
              <button
                type="submit"
                class="btn btn-primary"
              >
                Next
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
